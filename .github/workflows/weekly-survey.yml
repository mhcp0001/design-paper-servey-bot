name: Weekly Design Paper Survey

on:
  schedule:
    # 毎週月曜 0:00 UTC = 日本時間 9:00
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行も可能
    inputs:
      survey_date:
        description: '調査基準日 YYYY-MM-DD（省略時は実行日。過去週のバックフィル用）'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate config
        run: |
          # topics.json にTopic IDが設定されているか確認
          TOPIC_COUNT=$(python3 -c "import json; d=json.load(open('config/topics.json')); print(len(d.get('topics',[])))")
          if [ "$TOPIC_COUNT" -eq "0" ]; then
            echo "::warning::No Topic IDs configured. Run 'Discover Topic IDs' workflow first."
            echo "Proceeding with keyword search only."
          else
            echo "Found $TOPIC_COUNT Topic IDs configured."
          fi

      - name: Resolve survey date
        run: |
          set -euo pipefail
          SURVEY_DATE="${{ inputs.survey_date }}"
          if [ -z "${SURVEY_DATE}" ]; then
            SURVEY_DATE="$(date +%F)"
          fi
          if ! echo "${SURVEY_DATE}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || ! date -d "${SURVEY_DATE}" +%F >/dev/null 2>&1; then
            echo "::error::Invalid survey_date: '${SURVEY_DATE}' (expected YYYY-MM-DD)"
            exit 1
          fi
          echo "SURVEY_DATE=${SURVEY_DATE}" >> "$GITHUB_ENV"
          echo "Survey date resolved: ${SURVEY_DATE}"

      - name: Run Claude Code - Paper Survey
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            prompts/survey-prompt.md の指示に従って、
            過去7日間のビジネスデザイン・イノベーション論文サーベイを実行してください。

            実行手順:
            1. 調査基準日は ${{ env.SURVEY_DATE }} です（ワークフローが確定済みの値。推測・変更してはならない）。
               以降の手順の「<調査基準日>」はこの値を指す。
            2. prompts/survey-prompt.md を読む
            3. CLAUDE.md のルールに従う
            4. config/topics.json からTopic IDを読み込む
            5. config/sources.json からSource IDを読み込む
            6. OpenAlex REST API (curl) で論文を検索する
               - APIキー: ${{ secrets.OPENALEX_API_KEY }}
            7. reports/ 配下の過去レポートを確認して重複を除外する
            8. 各論文のopen_accessフィールド（is_oa, oa_status, oa_url）とprimary_location.pdf_urlを取得する
            9. 選定した論文の日本語要約を生成する
            10. prompts/survey-prompt.md の「出力先」章の仕様に従い、Write ツールで
                reports/<調査基準日>/ 配下に report.md・survey.json・OA論文PDF を実ファイルとして生成する

            検索日付範囲は <調査基準日> を終端とする過去7日間としてください
            （開始日は Bash: `date -d "<調査基準日> -7 days" +%F` で計算）。
            Topic IDが未設定の場合はキーワード検索（層2）とジャーナル検索（層3）のみ実行してください。

            【最重要・厳守事項】
            - レポートやJSONの内容を応答本文に貼り付けるだけでは「未完了」とみなす。
              必ず Write ツールを使って実ファイルとしてディスクに保存すること。
            - 以下のファイルを必ず Write ツールで作成すること（応答への記載だけでは不可）:
                - reports/<調査基準日>/report.md
                - reports/<調査基準日>/survey.json
            - 各ファイルを書き込んだ直後に、必ず Bash で `ls -la reports/<調査基準日>/` を実行し、
              ファイルが実在することを自分で確認してから次に進むこと。
            - 最後に必ず Bash で `git status --porcelain reports/` を実行し、変更が検出されることを
              確認すること。変更が検出されなければファイル書き込みが失敗しているので、Write をやり直すこと。
            - git add / git commit / git push は絶対に実行しないこと。コミットとpushは後続の
              ワークフローステップが行う。作業ツリーに未コミットの変更が残った状態で終了するのが正しい。
            - ファイル出力仕様の正（source of truth）は prompts/survey-prompt.md の「出力先」章。
          show_full_output: true
          settings: |
            {
              "defaultMode": "dontAsk",
              "permissions": {
                "allow": [
                  "Bash(*)",
                  "Read",
                  "Write",
                  "Edit",
                  "Glob",
                  "Grep",
                  "WebFetch(*)",
                  "WebSearch(*)"
                ]
              }
            }
          claude_args: "--model claude-sonnet-4-6 --max-turns 40"

      - name: Fallback - materialize report from Claude result
        run: |
          set -euo pipefail
          DATE="${SURVEY_DATE}"
          OUT_DIR="reports/${DATE}"
          OUT_FILE="${OUT_DIR}/report.md"

          # 根本対策A（Claude による Write）が効いていれば何もしない
          if [ -n "$(git status --porcelain reports/ 2>/dev/null)" ] || [ -f "${OUT_FILE}" ]; then
            echo "Report already written by Claude. Skipping fallback."
            exit 0
          fi

          echo "::warning::Claude did not write report files. Falling back to result extraction."
          LOG_JSON="${{ steps.claude.outputs.execution_file }}"
          if [ -z "${LOG_JSON}" ] || [ ! -f "${LOG_JSON}" ]; then
            echo "::error::No execution output file found; cannot fallback."
            exit 1
          fi

          mkdir -p "${OUT_DIR}"
          # execution_file は stream-json のイベント配列。result イベントの .result を抽出。
          # 単一オブジェクト形式（.result）にもフォールバック対応する。
          jq -r '
            if type=="array"
            then ([.[] | select(.type=="result") | .result] | last)
            else .result end // empty
          ' "${LOG_JSON}" > "${OUT_FILE}"

          if [ ! -s "${OUT_FILE}" ]; then
            echo "::error::Extracted report is empty."
            rm -f "${OUT_FILE}"
            exit 1
          fi

          echo "FALLBACK_USED=true" >> "$GITHUB_ENV"
          echo "Fallback report written to ${OUT_FILE} (degraded: survey.json/PDF are missing)."

      - name: Commit and push report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain reports/)" ]; then
            git add reports/
            git commit -m "docs: weekly design paper survey ${SURVEY_DATE}"
            git push
            echo "REPORT_CREATED=true" >> "$GITHUB_ENV"
            echo "REPORT_FILE=reports/${SURVEY_DATE}/report.md" >> "$GITHUB_ENV"
          elif [ -n "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline -- reports/ 2>/dev/null)" ]; then
            # 作業ツリーがクリーンでも、Claude が禁止を破って自分で commit した場合は未pushコミットが残る。
            # その場合はレポートを失わないよう push だけ行う。
            echo "::warning::Found unpushed local commit(s) touching reports/ (Claude committed directly). Pushing them."
            git push
            echo "REPORT_CREATED=true" >> "$GITHUB_ENV"
            echo "REPORT_FILE=reports/${SURVEY_DATE}/report.md" >> "$GITHUB_ENV"
          else
            # Claude の Write もフォールバックも何も残さなかった = 異常。緑のまま沈黙させない。
            echo "::error::No report files present after Claude run AND fallback. Failing the job."
            exit 1
          fi

      - name: Notify Discord
        if: env.REPORT_CREATED == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          REPORT_DATE="${SURVEY_DATE}"

          if [ "${FALLBACK_USED:-false}" = "true" ]; then
            CONTENT="⚠️ **週次デザイン論文サーベイ: フォールバック生成** (${REPORT_DATE})\\nClaudeが実ファイルを書き込めず、応答テキストからreport.mdのみ復元しました（survey.json・PDFは欠落）。\\nレポート: ${REPO_URL}/tree/main/reports/${REPORT_DATE}"
          else
            CONTENT="📖 **週次デザイン論文サーベイ完了** (${REPORT_DATE})\\nレポート: ${REPO_URL}/tree/main/reports/${REPORT_DATE}"
          fi

          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
              -d "{\"content\": \"${CONTENT}\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -H "Content-Type: application/json" \
              -d "{\"content\": \"🔴 **週次デザイン論文サーベイ失敗** (${SURVEY_DATE:-日付不明})\\n実行ログ: ${RUN_URL}\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
